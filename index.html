<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Répertoire de Moyennes Scolaires</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        
        .setup-zone { display: flex; gap: 15px; background: #eef2f7; padding: 15px; border-radius: 8px; margin-bottom: 20px; align-items: center; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        
        input, select, button { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        input[type="text"] { flex: 2; min-width: 150px; }
        input[type="number"] { flex: 1; min-width: 80px; }
        
        button { background: #3498db; color: white; cursor: pointer; border: none; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; padding: 6px 12px; font-size: 14px; }
        .btn-danger:hover { background: #c0392b; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #34495e; color: white; }
        
        .hidden { display: none; }
        .moyenne-box { background: #2ecc71; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; margin-top: 25px; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.2); }
        .classe-badge { background: #34495e; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculateur & Répertoire de Moyennes</h1>
    
    <div class="setup-zone">
        <label for="classeSelect"><strong>Choisir la classe :</strong></label>
        <select id="classeSelect" onchange="gererChangementClasse()">
            <option value="6ème">6ème</option>
            <option value="5ème">5ème</option>
            <option value="4ème">4ème</option>
            <option value="3ème">3ème</option>
            <option value="Seconde">Seconde</option>
            <option value="Première">Première</option>
            <option value="Terminale">Terminale</option>
        </select>

        <div id="zoneSerieTerminale" class="hidden">
            <label for="serieSelect"><strong>Série :</strong></label>
            <select id="serieSelect">
                <option value="A">Série A (Littéraire)</option>
                <option value="C">Série C (Scientifique/Maths)</option>
                <option value="D">Série D (Sciences Nat.)</option>
            </select>
        </div>
    </div>
    
    <div class="form-group">
        <input type="text" id="matiere" placeholder="Matière (ex: Mathématiques)">
        <input type="number" id="note" placeholder="Note /20" min="0" max="20" step="0.25">
        <input type="number" id="coefficient" placeholder="Coef" min="1" value="1">
        <button onclick="ajouterNote()">Ajouter au répertoire</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Classe / Catégorie</th>
                <th>Matière</th>
                <th>Note</th>
                <th>Coefficient</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableauNotes">
            </tbody>
    </table>

    <div class="moyenne-box">
        Moyenne Générale : <span id="moyenneGenerale">--</span> / 20
    </div>
</div>

<script>
    // Tableau principal contenant toutes nos notes
    let repertoireNotes = [];

    // Fonction qui affiche ou cache les séries A, C, D si on choisit "Terminale"
    function gererChangementClasse() {
        let classeChoisie = document.getElementById('classeSelect').value;
        let zoneSerie = document.getElementById('zoneSerieTerminale');
        
        if (classeChoisie === "Terminale") {
            zoneSerie.classList.remove('hidden');
        } else {
            zoneSerie.classList.add('hidden');
        }
    }

    function ajouterNote() {
        let classe = document.getElementById('classeSelect').value;
        let serie = document.getElementById('serieSelect').value;
        let matiereInput = document.getElementById('matiere');
        let noteInput = document.getElementById('note');
        let coefInput = document.getElementById('coefficient');

        let matiere = matiereInput.value.trim();
        let note = parseFloat(noteInput.value);
        let coef = parseFloat(coefInput.value);

        // Si c'est la terminale, on précise la série dans le nom de la catégorie
        let categorieFinale = classe;
        if (classe === "Terminale") {
            categorieFinale = `Terminale ${serie}`;
        }

        if (matiere !== "" && !isNaN(note) && !isNaN(coef) && note >= 0 && note <= 20) {
            
            let nouvelleNote = {
                id: Date.now(),
                categorie: categorieFinale,
                matiere: matiere,
                note: note,
                coef: coef
            };

            repertoireNotes.push(nouvelleNote);
            
            // Actualiser l'affichage
            mettreAJourInterface();

            // Réinitialiser les champs de saisie de la note
            matiereInput.value = "";
            noteInput.value = "";
            coefInput.value = "1";
        } else {
            alert("Veuillez remplir correctement tous les champs (Note valide entre 0 et 20).");
        }
    }

    function supprimerNote(id) {
        repertoireNotes = repertoireNotes.filter(item => item.id !== id);
        mettreAJourInterface();
    }

    function mettreAJourInterface() {
        let tableBody = document.getElementById('tableauNotes');
        tableBody.innerHTML = "";

        let sommeProduits = 0;
        let sommeCoefficients = 0;

        repertoireNotes.forEach(item => {
            sommeProduits += (item.note * item.coef);
            sommeCoefficients += item.coef;

            tableBody.innerHTML += `
                <tr>
                    <td><span class="classe-badge">${item.categorie}</span></td>
                    <td>${item.matiere}</td>
                    <td><strong>${item.note.toFixed(2)}</strong> /20</td>
                    <td>x${item.coef}</td>
                    <td><button class="btn-danger" onclick="supprimerNote(${item.id})">Supprimer</button></td>
                </tr>
            `;
        });

        // Calcul final de la moyenne générale du répertoire
        let affichageMoyenne = document.getElementById('moyenneGenerale');
        if (sommeCoefficients > 0) {
            let moyenne = sommeProduits / sommeCoefficients;
            affichageMoyenne.innerText = moyenne.toFixed(2);
        } else {
            affichageMoyenne.innerText = "--";
        }
    }
</script>

</body>
</html>
